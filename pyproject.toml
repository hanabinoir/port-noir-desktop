[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portnoir"
version = "0.1.0"
description = "PortNoir: macOS companion for Android over Wi-Fi"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7", "qasync>=0.27", "websockets>=13", "zeroconf>=0.132",
  "qrcode[pil]>=7.4", "cryptography>=42", "platformdirs>=4", "qtawesome>=1.3",
]

[project.scripts]
portnoir = "portnoir.main:main"

[tool.setuptools.packages.find]
include = ["portnoir*"]
